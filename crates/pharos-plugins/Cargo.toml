[package]
name = "pharos-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CoreDNS-compatible Plugins for the Pharos DNS server"

[dependencies]
bytes = "1"
getrandom = "0.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
pharos-kv = { version = "0.3.0", path = "../pharos-kv" }
pharos-corefile = { version = "0.3.0", path = "../pharos-corefile" }
pharos-proto = { version = "0.3.0", path = "../pharos-proto" }
pharos-server = { version = "0.3.0", path = "../pharos-server" }
pharos-dnssec = { version = "0.3.0", path = "../pharos-dnssec", optional = true }
pharos-kubernetes = { version = "0.3.0", path = "../pharos-kubernetes", optional = true }
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"], optional = true }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
serde_json = { version = "1", optional = true }
regex = { version = "1", optional = true }
regex-automata = "0.4"
arc-swap = "1"
maxminddb = { version = "0.33", optional = true }
aws-lc-rs = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
nix = { version = "0.31", features = ["net", "socket", "hostname"] }

[dev-dependencies]
aws-lc-rs = "1"
criterion = "0.5"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
hyper = { version = "1", features = ["server"] }
stats_alloc = "0.1.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "test-util"] }

[features]
default = [
    "plugin-root",
    "plugin-cancel",
    "plugin-timeouts",
    "plugin-debug",
    "plugin-shed",
    "plugin-acl",
    "plugin-any",
    "plugin-autopath",
    "plugin-auto",
    "plugin-bind",
    "plugin-bufsize",
    "plugin-cache",
    "plugin-chaos",
    "plugin-dns64",
    "plugin-dnssec",
    "plugin-dynupdate",
    "plugin-siit",
    "plugin-tsig",
    "plugin-transfer",
    "plugin-errors",
    "plugin-file",
    "plugin-erratic",
    "plugin-forward",
    "plugin-geoip",
    "plugin-grpc-server",
    "plugin-grpc",
    "plugin-header",
    "plugin-health",
    "plugin-hosts",
    "plugin-https",
    "plugin-https3",
    "plugin-k8s-external",
    "plugin-kubernetes",
    "plugin-loadbalance",
    "plugin-local",
    "plugin-log",
    "plugin-loop",
    "plugin-metadata",
    "plugin-minimal",
    "plugin-multisocket",
    "plugin-nsid",
    "plugin-prometheus",
    "plugin-proxyproto",
    "plugin-quic",
    "plugin-ready",
    "plugin-reload",
    "plugin-rewrite",
    "plugin-secondary",
    "plugin-sign",
    "plugin-template",
    "plugin-tls",
    "plugin-view",
    "plugin-whoami",
]
plugin-root = []
plugin-auto = ["dep:regex"]
plugin-metadata = []
plugin-geoip = ["dep:maxminddb", "dep:serde"]
plugin-cancel = []
plugin-proxyproto = []
plugin-quic = []
plugin-grpc-server = []
plugin-https = []
plugin-https3 = []
plugin-timeouts = []
plugin-multisocket = []
plugin-reload = []
plugin-nsid = []
plugin-bufsize = []
plugin-bind = []
plugin-debug = []
plugin-trace = []
plugin-ready = []
plugin-health = []
plugin-pprof = []
plugin-shed = []
plugin-prometheus = ["dep:serde", "dep:serde_yaml_ng"]
plugin-errors = ["dep:regex"]
plugin-log = []
plugin-dnstap = []
plugin-local = []
plugin-dns64 = []
plugin-siit = []
plugin-any = []
plugin-chaos = []
plugin-loadbalance = []
plugin-tsig = []
plugin-rewrite = ["dep:regex"]
plugin-autopath = []
plugin-acl = []
plugin-cache = []
plugin-header = []
plugin-dnssec = ["dep:pharos-dnssec"]
dnssec-aws = ["plugin-dnssec", "dep:aws-config", "dep:aws-sdk-secretsmanager", "dep:serde", "dep:serde_json"]
plugin-tls = ["dep:aws-lc-rs", "dep:base64", "dep:serde_json"]
plugin-minimal = []
plugin-template = ["dep:regex"]
plugin-transfer = []
plugin-dynupdate = []
plugin-hosts = []
plugin-route53 = []
plugin-azure = []
plugin-clouddns = []
plugin-k8s-external = ["plugin-kubernetes"]
plugin-kubernetes = ["dep:pharos-kubernetes"]
plugin-file = []
plugin-secondary = []
plugin-etcd = []
plugin-loop = []
plugin-forward = []
plugin-grpc = []
plugin-erratic = []
plugin-whoami = []
plugin-on = []
plugin-sign = ["dep:pharos-dnssec"]
plugin-view = []
plugin-nomad = []

[lints]
workspace = true

[[bench]]
name = "log"
harness = false
required-features = ["plugin-log"]

[[bench]]
name = "chain"
harness = false
required-features = ["plugin-whoami"]

[[bench]]
name = "cache"
harness = false
required-features = ["plugin-cache", "plugin-whoami", "plugin-template"]

[[bench]]
name = "dnssec"
harness = false
required-features = ["plugin-dnssec", "plugin-whoami"]
