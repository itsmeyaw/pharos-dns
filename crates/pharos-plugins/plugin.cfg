# Directives are registered in the order they should be executed.
#
# Ordering is VERY important. Every plugin will feel the effects of all other
# plugin below (after) them during a request, but they must not care what plugin
# above them are doing.

# How to rebuild with updated plugin configurations: Modify the list below and
# run `cargo build`. build.rs generates the Plugin Chain from this list; only
# Plugins whose `plugin-<name>` Cargo feature is enabled are compiled in.

# Each line is `<plugin-name>:<package-name>`, kept in CoreDNS's format.
# Only the name is read; third-party Plugins are not supported. The generator
# maps each implemented Plugin to src/<name>/setup.rs.

root:root
metadata:metadata
geoip:geoip
cancel:cancel
proxyproto:proxyproto
quic:quic
grpc_server:grpc_server
https:https
https3:https3
timeouts:timeouts
multisocket:multisocket
reload:reload
nsid:nsid
bufsize:bufsize
bind:bind
debug:debug
