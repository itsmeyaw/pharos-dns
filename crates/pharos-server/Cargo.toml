[package]
name = "pharos-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Listeners, Plugin Chain contract and metrics for the Pharos DNS server"

[dependencies]
arc-swap = "1"
aws-lc-rs = "1"
base64 = "0.22"
bcrypt = "0.19"
bytes = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
pharos-proto = { version = "0.3.0", path = "../pharos-proto" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-native-certs = "0.8"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["fs", "socket", "uio", "net"] }

[dev-dependencies]
criterion = "0.5"
stats_alloc = "0.1.10"

[lints]
workspace = true

[[bench]]
name = "outcome"
harness = false
