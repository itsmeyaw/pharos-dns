[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aws-lc-rs = "1.19"
bytes = "1"
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
pharos-dnssec = { path = "../crates/pharos-dnssec", version = "0.4.0" }
pharos-proto = { path = "../crates/pharos-proto" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }

[lints]
workspace = true
